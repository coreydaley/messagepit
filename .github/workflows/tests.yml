name: Tests
on:
  pull_request:
    branches: [main, 'feature/**']
  push:
    branches: [main, 'feature/**']
jobs:
  test:
    strategy:
      matrix:
        go-version: [stable]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
    - uses: actions/checkout@v6
    - name: Test Go linting (gofmt)
      if: startsWith(matrix.os, 'ubuntu') == true
      run: gofmt -s -w . && git diff --exit-code
    - name: Run Go tests
      run: go test -p 1 ./internal/storage ./internal/twilio ./internal/sendgrid ./internal/webhookd ./server ./internal/smtpd ./internal/pop3 ./internal/tools ./internal/html2text ./internal/htmlcheck ./internal/linkcheck -v
    - name: Run Go benchmarking
      run: go test -p 1 ./internal/storage ./internal/html2text -bench=.

    # build the assets
    - name: Set up node environment
      if: startsWith(matrix.os, 'ubuntu') == true
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: 'npm'
    - name: Install JavaScript dependencies
      if: startsWith(matrix.os, 'ubuntu') == true
      run: npm install
    - name: Run JavaScript linting
      if: startsWith(matrix.os, 'ubuntu') == true
      run: npm run lint
    - name: Test JavaScript packaging
      if: startsWith(matrix.os, 'ubuntu') == true
      run: npm run package
